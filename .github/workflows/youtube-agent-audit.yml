name: YouTube Agent Audit
on:
  push:
    branches: [main]
    paths:
      - "youtube_agent.py"
      - "tests/test_youtube_agent.py"
      - "rendering/batch_fallback.py"
      - "rendering/verify_batch.py"
      - ".github/workflows/youtube-agent-audit.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python tests/test_youtube_agent.py

  fallback-episodes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Generate EP02-EP10
        run: python rendering/batch_fallback.py
      - name: Verify artifact count and media
        run: python rendering/verify_batch.py
      - name: Upload EP02-EP10 evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: short-drama-ep02-ep10-fallback-evidence
          path: build/episodes/
          if-no-files-found: error
