name: YouTube Agent Audit
on:
  push:
    branches: [main]
    paths:
      - "youtube_agent.py"
      - "tests/test_youtube_agent.py"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python tests/test_youtube_agent.py
