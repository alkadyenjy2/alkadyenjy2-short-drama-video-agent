name: YouTube Agent Audit
on:
  push:
    branches: [main]
    paths:
      - "youtube_agent.py"
      - "tests/test_youtube_agent.py"
      - "rendering/batch_fallback.py"
      - ".github/workflows/youtube-agent-audit.yml"
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python tests/test_youtube_agent.py

  fallback-episodes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install render dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
      - name: Generate EP02-EP10
        run: python rendering/batch_fallback.py
      - name: Verify artifact count and media
        shell: bash
        run: |
          set -euo pipefail
          test "$(find build/episodes -name '*.mp4' | wc -l)" -eq 9
          test "$(find build/episodes -name '*.manifest.json' | wc -l)" -eq 9
          python - <<'PY'
import json, subprocess
from pathlib import Path
for manifest_path in sorted(Path("build/episodes").glob("EP*/EP*.manifest.json")):
    m=json.loads(manifest_path.read_text())
    p=Path(m["artifact"])
    assert p.exists() and p.stat().st_size > 0, p
    probe=json.loads(subprocess.check_output([
        "ffprobe","-v","error","-show_format","-show_streams","-of","json",str(p)
    ]))
    video=next(s for s in probe["streams"] if s.get("codec_type")=="video")
    assert video.get("codec_name")=="h264", (p, video)
    assert int(video.get("width",0))==720 and int(video.get("height",0))==1280, (p, video)
    assert 94.5 <= float(probe["format"].get("duration","0")) <= 95.5, (p, probe["format"])
    subprocess.run(["ffmpeg","-v","error","-i",str(p),"-f","null","-"],check=True)
    print("verified", p, m["sha256"])
PY
      - name: Upload EP02-EP10 evidence artifacts
        uses: actions/upload-artifact@v4
        with:
          name: short-drama-ep02-ep10-fallback-evidence
          path: build/episodes/
          if-no-files-found: error
