name: Python audit
on:
  push:
    branches: [main]
    paths:
      - "publisher.py"
      - "tests/**"
      - "requirements.txt"
      - "trend_intelligence.py"
      - "rights_engine.py"
      - "idea_inbox.py"
      - "analytics_schema.py"
      - "source_adapters.py"
      - "platform_recommender.py"
      - "discovery_pipeline.py"
      - ".github/workflows/python-audit.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python tests/test_meta_audit.py
      - run: python tests/test_tiktok_youtube_audit.py
      - run: python tests/test_p1_intelligence_audit.py
      - run: python tests/test_discovery_pipeline.py
