name: Python audit
on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "web_app.py"
      - "health.py"
      - "persistence/**"
      - "tests/**"
      - ".github/workflows/python-audit.yml"
  push:
    branches: [main]
    paths:
      - "main.py"
      - "publisher.py"
      - "tests/**"
      - "requirements.txt"
      - "trend_intelligence.py"
      - "rights_engine.py"
      - "idea_inbox.py"
      - "analytics_schema.py"
      - "source_adapters.py"
      - "platform_recommender.py"
      - "discovery_pipeline.py"
      - "idea_fetcher.py"
      - "rights_policy_evidence.py"
      - "analytics_adapters.py"
      - "analytics_ingestion.py"
      - "learning_loop.py"
      - "meta_analytics.py"
      - "ad_revenue_schema.py"
      - "transcription_adapter.py"
      - "video_generation_adapter.py"
      - "meta_ads_analytics.py"
      - "http_video_generation.py"
      - "web_app.py"
      - "health.py"
      - "persistence/**"
      - ".github/workflows/python-audit.yml"
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: python tests/test_meta_audit.py
      - run: python tests/test_tiktok_youtube_audit.py
      - run: PYTHONPATH=. python tests/test_youtube_agent.py
      - run: python tests/test_p1_intelligence_audit.py
      - run: python tests/test_discovery_pipeline.py
      - run: python tests/test_idea_fetch_and_rights.py
      - run: python tests/test_analytics_persistence.py
      - run: python tests/test_analytics_adapters.py
      - run: python tests/test_analytics_ingestion.py
      - run: python tests/test_learning_loop.py
      - run: python tests/test_meta_finance_media_boundaries.py
      - run: python tests/test_meta_ads_and_http_generation.py
      - run: python tests/test_web_app_videos.py
      - run: PYTHONPATH=. python tests/test_persistent_dashboard_database.py
      - run: PYTHONPATH=. python tests/test_backend_app.py
      - run: PYTHONPATH=. python tests/test_telegram_startup_mode.py
      - run: PYTHONPATH=. python tests/test_repository_factory.py
  render_free_fallback:
    if: github.event_name == 'pull_request' && github.head_ref == 'build-free-episode1-fallback-run'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install free media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
      - name: Render and verify playable fallback
        run: python rendering/episode1_animatic.py
      - name: Upload verified media
        uses: actions/upload-artifact@v4
        with:
          name: short-drama-episode1-fallback-verified
          path: |
            build/THE_LAST_VOICEMAIL_Episode1_Fallback_Animatic.mp4
            build/THE_LAST_VOICEMAIL_Episode1_Fallback_Animatic.manifest.json
          if-no-files-found: error
          retention-days: 14

