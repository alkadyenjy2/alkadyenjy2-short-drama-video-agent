name: Manual Cloud Trend Scanner
on:
  workflow_dispatch:
    inputs:
      region_code:
        description: "YouTube region code"
        required: true
        default: "US"
        type: choice
        options:
          - US
          - GB
          - EG
          - CA
          - AU
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install minimal dependency
        run: python -m pip install requests
      - name: Run live trend scan
        env:
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          TREND_REGION_CODE: ${{ inputs.region_code }}
        run: python scripts/manual_trend_scanner.py
      - name: Upload results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: manual-trend-scanner-evidence
          path: build/trend-scan/
          if-no-files-found: warn
          retention-days: 7
